name: ZIP sync

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  WX_VERSION: 3.3.1

jobs:
  zip-afs-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++-14 zlib1g-dev libglib2.0-dev pkg-config zip python3
      - name: Build and run ZIP tests
        run: CXX=g++-14 bash Tests/zip_afs/run.sh

  full-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 zlib1g-dev libgtk-3-dev libcurl4-openssl-dev libssh2-1-dev libssl-dev libidn2-dev pkg-config
      - name: Cache wxWidgets
        id: cache-wx
        uses: actions/cache@v4
        with:
          path: ~/wx
          key: wx-${{ env.WX_VERSION }}-noexcept-gtk3-ubuntu24
      - name: Build wxWidgets (FreeFileSync requires wxUSE_EXCEPTIONS=0)
        if: steps.cache-wx.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/wxWidgets/wxWidgets/releases/download/v${WX_VERSION}/wxWidgets-${WX_VERSION}.tar.bz2
          tar xjf wxWidgets-${WX_VERSION}.tar.bz2
          cd wxWidgets-${WX_VERSION}
          CC=gcc-14 CXX=g++-14 ./configure --prefix=$HOME/wx --with-gtk=3 --disable-shared --disable-exceptions --disable-debug --without-libtiff --disable-webview --disable-mediactrl
          make -j"$(nproc)"
          make install
      - name: Build FreeFileSync
        run: |
          export PATH=$HOME/wx/bin:$PATH
          make -C FreeFileSync/Source -j"$(nproc)" CXX=g++-14
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: FreeFileSync-linux-x86_64
          path: FreeFileSync/Build/Bin/