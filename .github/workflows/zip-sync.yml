name: ZIP sync

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  zip-afs-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++-14 zlib1g-dev zip python3
      - name: Build and run ZIP tests
        run: CXX=g++-14 bash Tests/zip_afs/run.sh

  full-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 zlib1g-dev libwxgtk3.2-dev libgtk-3-dev libcurl4-openssl-dev libssh2-1-dev libssl-dev libidn2-dev pkg-config
      - name: Build FreeFileSync
        run: make -C FreeFileSync/Source -j"$(nproc)" CXX=g++-14
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: FreeFileSync-linux-x86_64
          path: FreeFileSync/Build/Bin/
